<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Link Organizer with Previews</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f8fc; --surface: #ffffff; --surface-2: #f1f3f9; --border: #e6e8f0;
    --text: #1a1f36; --text-muted: #6b7194; --accent: #6366f1; --accent-hover: #4f46e5;
    --accent-soft: #eef2ff; --danger: #ef4444; --danger-soft: #fef2f2;
    --success: #10b981; --warning: #f59e0b; --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --shadow: 0 4px 12px rgba(15,23,42,.08); --shadow-lg: 0 20px 40px rgba(15,23,42,.12);
  }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; box-shadow: 0 4px 12px rgba(99,102,241,.35); }
  .logo-text { font-weight: 700; font-size: 16px; }
  .logo-sub { font-size: 11px; color: var(--text-muted); }
  .sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); padding: 6px 10px; background: var(--surface-2); border-radius: 8px; margin-bottom: 16px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse-dot 2s ease infinite; }
  .sync-dot.offline { background: var(--warning); animation: none; }
  .sync-dot.error { background: var(--danger); animation: none; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 0 10px; margin: 18px 0 10px; font-weight: 600; }
  .filter-list { list-style: none; }
  .filter-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--text); transition: all .15s ease; margin-bottom: 2px; }
  .filter-item:hover { background: var(--surface-2); }
  .filter-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .filter-item .count { margin-left: auto; background: var(--surface-2); color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .filter-item.active .count { background: white; color: var(--accent); }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s ease; font-family: inherit; }
  .btn-primary { background: var(--accent); color: white; width: 100%; box-shadow: 0 4px 12px rgba(99,102,241,.3); }
  .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-ghost { background: transparent; color: var(--text); width: 100%; justify-content: flex-start; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-danger { color: var(--danger); }
  .btn-danger:hover { background: var(--danger-soft); }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .search-box { flex: 1; max-width: 480px; position: relative; }
  .search-box input { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--surface-2); outline: none; transition: all .15s; font-family: inherit; }
  .search-box input:focus { background: white; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); transition: all .15s; }
  .icon-btn:hover { background: var(--surface-2); }
  .content { padding: 28px; flex: 1; }
  .content-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .content-title { font-size: 22px; font-weight: 700; }
  .content-sub { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
  .quick-add { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); }
  .quick-add-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .quick-add input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; font-family: inherit; color: var(--text); }
  .quick-add input::placeholder { color: var(--text-muted); }
  .quick-add-btn { padding: 10px 20px; border-radius: 10px; border: none; background: var(--accent); color: white; font-weight: 600; font-size: 14px; cursor: pointer; transition: all .15s; display: flex; align-items: center; gap: 6px; font-family: inherit; white-space: nowrap; }
  .quick-add-btn:hover { background: var(--accent-hover); }
  .quick-add-btn:disabled { opacity: .5; cursor: not-allowed; }
  .quick-add-btn.loading { background: var(--surface-2); color: var(--text-muted); }
  .quick-add-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; min-width: 140px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 32px; padding: 20px 10px; }
  .card { position: relative; perspective: 1200px; animation: fadeUp .4s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  .card-inner { position: relative; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); overflow: visible; cursor: pointer; transition: transform .4s cubic-bezier(0.03, 0.98, 0.52, 0.99), box-shadow .4s ease; }
  .card-inner:hover { box-shadow: 0 30px 60px -15px rgba(99,102,241,.25); border-color: var(--accent); }
  .card-preview-wrap { position: relative; width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; padding: 20px 20px 0; }
  .card-preview { position: relative; width: 100%; height: 200px; transition: transform .5s cubic-bezier(0.03, 0.98, 0.52, 0.99); }
  .card-preview img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 15px; border: 1px solid rgba(0,0,0,.08); box-shadow: 0 20px 40px -10px rgba(0,0,0,.2); }
  .card-actions { position: absolute; top: 28px; right: 28px; display: flex; gap: 5px; opacity: 0; transition: opacity .2s ease; z-index: 10; background: rgba(255,255,255,.85); backdrop-filter: blur(12px); padding: 4px; border-radius: 10px; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
  .card-inner:hover .card-actions { opacity: 1; }
  .card-action-btn { width: 30px; height: 30px; border-radius: 7px; background: transparent; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); transition: all .15s; }
  .card-action-btn:hover { background: var(--surface-2); transform: scale(1.08); }
  .card-action-btn.delete:hover { background: #fef2f2; color: var(--danger); }
  .card-body { padding: 16px 22px 12px; display: flex; flex-direction: column; gap: 4px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-url { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  .card-url .favicon { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  .card-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted); padding-top: 12px; border-top: 1px solid var(--border); }
  .badge { display
