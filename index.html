<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Link Organizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #f7f8fc; --surface: #ffffff; --surface-2: #f1f3f9; --border: #e6e8f0; --text: #1a1f36; --text-muted: #6b7194; --accent: #6366f1; --accent-hover: #4f46e5; --accent-soft: #eef2ff; --danger: #ef4444; --danger-soft: #fef2f2; --success: #10b981; }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 24px 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 6px 8px 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; }
  .logo-text { font-weight: 700; font-size: 16px; }
  .logo-sub { font-size: 11px; color: var(--text-muted); }
  .sync-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); padding: 6px 10px; background: var(--surface-2); border-radius: 8px; margin-bottom: 16px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-muted); padding: 0 10px; margin: 18px 0 10px; font-weight: 600; }
  .filter-list { list-style: none; }
  .filter-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--text); transition: all .15s ease; margin-bottom: 2px; }
  .filter-item:hover { background: var(--surface-2); }
  .filter-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .filter-item .count { margin-left: auto; background: var(--surface-2); color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-footer { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 500; transition: all .15s ease; font-family: inherit; }
  .btn-primary { background: var(--accent); color: white; width: 100%; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--text); width: 100%; justify-content: flex-start; }
  .btn-ghost:hover { background: var(--surface-2); }
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10; }
  .search-box { flex: 1; max-width: 480px; position: relative; }
  .search-box input { width: 100%; padding: 10px 14px 10px 40px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--surface-2); outline: none; font-family: inherit; }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
  .content { padding: 28px; flex: 1; }
  .content-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; }
  .content-title { font-size: 22px; font-weight: 700; }
  .content-sub { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
  .quick-add { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
  .quick-add-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .quick-add input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; font-family: inherit; color: var(--text); }
  .quick-add-btn { padding: 10px 20px; border-radius: 10px; border: none; background: var(--accent); color: white; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; }
  .quick-add-btn:hover { background: var(--accent-hover); }
  .quick-add-btn:disabled { opacity: .5; cursor: not-allowed; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 32px; padding: 20px 10px; }
  .card { position: relative; background: var(--surface); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px rgba(0,0,0,.1); border-color: var(--accent); }
  .card-preview { width: 100%; height: 200px; background: var(--surface-2); overflow: hidden; position: relative; }
  .card-preview img { width: 100%; height: 100%; object-fit: cover; }
  .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 5px; opacity: 0; transition: opacity .2s; }
  .card:hover .card-actions { opacity: 1; }
  .card-action-btn { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.95); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); backdrop-filter: blur(8px); }
  .card-action-btn:hover { background: white; transform: scale(1.08); }
  .card-body { padding: 16px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-url { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-muted); padding-top: 12px; border-top: 1px solid var(--border); margin-top: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--surface-2); }
  .empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s ease; padding: 20px; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: white; border-radius: 18px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; transform: translateY(20px); transition: transform .25s ease; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: var(--surface-2); }
  .modal-body { padding: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  .field input, .field textarea, .field select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; background: white; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
  .btn-secondary { background: var(--surface-2); color: var(--text); }
  .btn-secondary:hover { background: #e5e7f0; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: white; padding: 12px 20px; border-radius: 12px; font-size: 14px; z-index: 200; transition: transform .25s ease; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .paste-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <div><div class="logo-text">Link Organizer</div><div class="logo-sub">Your personal library</div></div>
    </div>
    <div class="sync-status" id="syncStatus">
      <div class="sync-dot" id="syncDot"></div><span id="syncText">Auto-sync active</span>
    </div>
    <div class="section-title">Categories</div>
    <ul class="filter-list" id="categoryList"></ul>
    <div class="section-title">Quick Filters</div>
    <ul class="filter-list" id="filterList">
      <li class="filter-item" data-filter="recent">🕐 Recently Added</li>
      <li class="filter-item" data-filter="favorites">⭐ Favorites</li>
    </ul>
    <div class="sidebar-footer">
      <button class="btn btn-primary" id="addBtn">➕ Add New Link</button>
      <div style="margin-top:10px;">
        <button class="btn btn-ghost" id="exportBtn">📥 Export Backup</button>
        <button class="btn btn-ghost" id="importBtn">📤 Import Backup</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" />
      </div>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by title, URL, or description..." />
      </div>
    </div>
    <div class="content">
      <div class="quick-add">
        <div class="quick-add-icon"></div>
        <input type="url" id="quickUrl" placeholder="Just paste a link here..." />
        <button class="quick-add-btn" id="quickAddBtn" disabled><span>Save</span></button>
      </div>
      <div class="content-header"><div><h1 class="content-title" id="viewTitle">All Links</h1><div class="content-sub" id="viewSub">Your saved collection</div></div></div>
      <div class="grid" id="grid"></div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header"><div class="modal-title" id="modalTitle">Add New Link</div><button class="modal-close" id="closeModal">✕</button></div>
    <div class="modal-body">
      <div class="field">
        <label>Screenshot or Image</label>
        <div id="pasteArea" style="border: 2px dashed var(--border); border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all .2s; background: var(--surface-2);">
          <div style="font-size: 32px; margin-bottom: 10px;">📸</div>
          <div style="font-weight: 600; margin-bottom: 5px;">Paste or drop screenshot here</div>
          <div class="paste-hint">Press Ctrl+V to paste an image</div>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" />
      </div>
      <div class="field"><label>Website URL *</label><input type="url" id="urlInput" placeholder="https://example.com" /></div>
      <div class="field"><label>Title</label><input type="text" id="titleInput" /></div>
      <div class="field"><label>Category</label><select id="categoryInput"></select></div>
      <div class="field"><label>Description</label><textarea id="descInput" rows="3"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="deleteBtn" style="display:none;margin-right:auto;">Delete</button>
      <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveBtn">Save Link</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============ AUTO SYNC CONFIGURATION ============
// Your Google Sheet URL is hardcoded here. It will sync automatically in the background.
const AUTO_SYNC_URL = "https://script.google.com/macros/s/AKfycbzWVReYfx1sgRvdgevqqm7xCZcOZvsPc88sQhar_kFf6UTlMFiqvNt4lDpJinC6LxH1/exec";

// ============ DATABASE ============
const DB_NAME = 'LinkOrganizerDB'; const STORE_NAME = 'links';
function openDB() { return new Promise((resolve, reject) => { const req = indexedDB.open(DB_NAME, 1); req.onerror = () => reject(req.error); req.onsuccess = () => resolve(req.result); req.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' }); }; }); }
async function dbGetAll() { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readonly'); const req = tx.objectStore(STORE_NAME).getAll(); req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); }); }
async function dbPut(link) { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); const req = tx.objectStore(STORE_NAME).put(link); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }
async function dbDelete(id) { const db = await openDB(); return new Promise((resolve, reject) => { const tx = db.transaction(STORE_NAME, 'readwrite'); const req = tx.objectStore(STORE_NAME).delete(id); req.onsuccess = () => resolve(); req.onerror = () => reject(req.error); }); }

// ============ SILENT BACKGROUND SYNC ============
// This runs invisibly. It doesn't show popups or slow down your app.
let syncTimeout;
function triggerBackgroundSync() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    dbGetAll().then(links => {
      const data = links.map(l => ({ id: l.id, url: l.url, title: l.title, description: l.description, category: l.category, favorite: l.favorite, date: l.date }));
      // Fire and forget - we don't wait for the response
      fetch(AUTO_SYNC_URL + '?action=write', { method: 'POST', body: JSON.stringify(data) })
        .then(() => console.log('Background sync successful'))
        .catch(e => console.log('Background sync failed (offline?)', e));
    });
  }, 1000); // Waits 1 second after you stop typing/clicking to sync
}

// ============ DATA & HELPERS ============
const CATEGORIES = { work: { name: 'Work', color: '#6366f1', icon: '💼' }, research: { name: 'Research', color: '#10b981', icon: '' }, shopping: { name: 'Shopping', color: '#f59e0b', icon: '🛍️' }, entertainment: { name: 'Entertainment', color: '#ef4444', icon: '🎬' }, productivity: { name: 'Productivity', color: '#8b5cf6', icon: '⚡' }, social: { name: 'Social', color: '#3b82f6', icon: '💬' }, news: { name: 'News', color: '#ec4899', icon: '📰' }, education: { name: 'Education', color: '#14b8a6', icon: '' }, design: { name: 'Design', color: '#f97316', icon: '🎨' }, finance: { name: 'Finance', color: '#059669', icon: '💰' }, travel: { name: 'Travel', color: '#0ea5e9', icon: '✈️' }, food: { name: 'Food', color: '#dc2626', icon: '🍕' }, health: { name: 'Health', color: '#22c55e', icon: '💊' }, tech: { name: 'Tech', color: '#6366f1', icon: '💻' }, other: { name: 'Other', color: '#6b7280', icon: '🔗' } };
const DOMAIN_RULES = [ { keys: ['github','gitlab','stackoverflow','vercel','netlify','jira'], cat: 'work', desc: 'Development platform' }, { keys: ['youtube','netflix','spotify','twitch'], cat: 'entertainment', desc: 'Entertainment platform' }, { keys: ['notion','trello','todoist'], cat: 'productivity', desc: 'Productivity tool' }, { keys: ['twitter','facebook','instagram','linkedin','reddit'], cat: 'social', desc: 'Social media' }, { keys: ['amazon','ebay','etsy'], cat: 'shopping', desc: 'Shopping site' } ];
const KNOWN_TITLES = { 'github.com': 'GitHub', 'medium.com': 'Medium', 'amazon.com': 'Amazon', 'youtube.com': 'YouTube', 'notion.so': 'Notion', 'twitter.com': 'Twitter', 'reddit.com': 'Reddit', 'linkedin.com': 'LinkedIn', 'netflix.com': 'Netflix', 'spotify.com': 'Spotify' };

let links = []; let currentFilter = { type: 'all' }; let searchQuery = ''; let editingId = null; let quickAddData = null; let quickTimer = null; let currentImage = null;

function extractDomain(url) { try { return new URL(url).hostname.replace('www.',''); } catch { return url; } }
function autoDetect(url) {
  const domain = extractDomain(url).toLowerCase(); let cat = 'other'; let desc = ''; let title = '';
  for (const [k, v] of Object.entries(KNOWN_TITLES)) { if (domain === k || domain.endsWith('.' + k)) { title = v; break; } }
  if (!title) title = domain.split('.')[0].charAt(0).toUpperCase() + domain.split('.')[0].slice(1);
  for (const r of DOMAIN_RULES) { if (r.keys.some(k => domain.includes(k))) { cat = r.cat; desc = r.desc; break; } }
  if (!desc) desc = 'Website at ' + domain;
  return { title, category: cat, description: desc };
}
function getScreenshot(url) { return 'https://image.thum.io/get/width/800/crop/500/noanimate/' + encodeURIComponent(url); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// ============ IMAGE PASTE FEATURE ============
const pasteArea = document.getElementById('pasteArea');
const imageInput = document.getElementById('imageInput');

pasteArea.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImageFile(e.target.files[0]); });

document.addEventListener('paste', (e) => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  const items = e.clipboardData.items;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      handleImageFile(items[i].getAsFile());
      e.preventDefault();
      break;
    }
  }
});

function handleImageFile(file) {
  if (!file.type.startsWith('image/')) { showToast('Please select an image file', 'error'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    currentImage = e.target.result;
    pasteArea.innerHTML = '<img src="' + currentImage + '" style="max-width:100%;max-height:200px;border-radius:8px;" /><div style="margin-top:10px;font-weight:600;color:var(--success);">✓ Image loaded</div><div class="paste-hint">Click to change</div>';
    pasteArea.style.borderColor = 'var(--success)';
    pasteArea.style.background = '#ecfdf5';
  };
  reader.readAsDataURL(file);
}

// ============ RENDER ============
function renderCategories() {
  const list = document.getElementById('categoryList'); const counts = {};
  links.forEach(l => { counts[l.category] = (counts[l.category] || 0) + 1; });
  let html = '<li class="filter-item ' + (currentFilter.type === 'all' ? 'active' : '') + '" data-cat="all"> All Links <span class="count">' + links.length + '</span></li>';
  Object.entries(CATEGORIES).forEach(([k, c]) => { const cnt = counts[k] || 0; if (cnt === 0) return; html += '<li class="filter-item ' + (currentFilter.type === 'category' && currentFilter.value === k ? 'active' : '') + '" data-cat="' + k + '"><span class="cat-dot" style="background:' + c.color + '"></span>' + c.icon + ' ' + c.name + ' <span class="count">' + cnt + '</span></li>'; });
  list.innerHTML = html;
  list.querySelectorAll('.filter-item').forEach(el => { el.addEventListener('click', () => { const cat = el.dataset.cat; currentFilter = cat === 'all' ? { type: 'all' } : { type: 'category', value: cat }; render(); }); });
}

function getFiltered() {
  let res = [...links];
  if (currentFilter.type === 'category') res = res.filter(l => l.category === currentFilter.value);
  else if (currentFilter.type === 'recent') res = res.filter(l => new Date(l.date).getTime() > Date.now() - 86400000 * 7);
  else if (currentFilter.type === 'favorites') res = res.filter(l => l.favorite);
  if (searchQuery) { const q = searchQuery.toLowerCase(); res = res.filter(l => l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q)); }
  res.sort((a,b) => new Date(b.date) - new Date(a.date));
  return res;
}

function renderGrid() {
  const grid = document.getElementById('grid'); const filtered = getFiltered();
  const titleEl = document.getElementById('viewTitle'); const subEl = document.getElementById('viewSub');
  if (currentFilter.type === 'all') { titleEl.textContent = 'All Links'; subEl.textContent = links.length + ' saved links'; }
  else if (currentFilter.type === 'category') { titleEl.textContent = CATEGORIES[currentFilter.value].icon + ' ' + CATEGORIES[currentFilter.value].name; subEl.textContent = filtered.length + ' links'; }
  else if (currentFilter.type === 'recent') { titleEl.textContent = ' Recently Added'; subEl.textContent = 'Last 7 days'; }
  else if (currentFilter.type === 'favorites') { titleEl.textContent = '⭐ Favorites'; subEl.textContent = filtered.length + ' links'; }
  
  if (filtered.length === 0) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1;"><div style="font-size:48px;margin-bottom:16px;"></div><h3>No links yet</h3><p>Paste a link or screenshot above to get started!</p></div>'; return; }
  
  grid.innerHTML = filtered.map((l, i) => {
    const cat = CATEGORIES[l.category] || CATEGORIES.other; const domain = extractDomain(l.url);
    const screenshot = l.preview || getScreenshot(l.url);
    return '<div class="card" data-id="' + l.id + '" style="animation-delay:' + (i * 40) + 'ms;">' +
      '<div class="card-actions">' +
        '<button class="card-action-btn" data-action="fav" style="color:' + (l.favorite ? '#f59e0b' : 'inherit') + '">⭐</button>' +
        '<button class="card-action-btn" data-action="copy"></button>' +
        '<button class="card-action-btn" data-action="open">↗</button>' +
        '<button class="card-action-btn delete" data-action="delete">🗑</button>' +
      '</div>' +
      '<div class="card-preview"><img src="' + screenshot + '" alt="' + escapeHtml(l.title) + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'800\' height=\'500\'><rect width=\'800\' height=\'500\' fill=\'' + cat.color + '\'/><text x=\'400\' y=\'280\' text-anchor=\'middle\' font-size=\'64\' fill=\'white\'>' + cat.icon + '</text></svg>\';"/></div>' +
      '<div class="card-body">' +
        '<div class="card-title">' + escapeHtml(l.title) + '</div>' +
        '<div class="card-url">🌐 ' + escapeHtml(domain) + '</div>' +
        '<div class="card-desc">' + escapeHtml(l.description) + '</div>' +
        '<div class="card-meta"><span class="badge"><span class="cat-dot" style="background:' + cat.color + '"></span>' + cat.name + '</span><span>' + new Date(l.date).toLocaleDateString() + '</span></div>' +
      '</div></div>';
  }).join('');
  
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (btn) {
        e.stopPropagation();
        const id = card.dataset.id; const action = btn.dataset.action;
        const link = links.find(l => l.id === id);
        if (action === 'fav') { link.favorite = !link.favorite; dbPut(link).then(() => { links = links.slice(); render(); triggerBackgroundSync(); }); }
        else if (action === 'copy') { navigator.clipboard.writeText(link.url); showToast('Copied!'); }
        else if (action === 'open') { window.open(link.url, '_blank'); }
        else if (action === 'delete') { if (confirm('Delete?')) { dbDelete(id).then(() => { links = links.filter(l => l.id !== id); render(); triggerBackgroundSync(); }); } }
        return;
      }
      openEditModal(card.dataset.id);
    });
  });
}

function render() { renderCategories(); renderGrid(); }

// ============ MODAL ============
const modal = document.getElementById('modal');
function openModal() { modal.classList.add('open'); }
function closeModal() { modal.classList.remove('open'); editingId = null; currentImage = null; resetPasteArea(); }
function populateCats() { document.getElementById('categoryInput').innerHTML = Object.entries(CATEGORIES).map(([k, c]) => '<option value="' + k + '">' + c.icon + ' ' + c.name + '</option>').join(''); }
function resetPasteArea() {
  pasteArea.innerHTML = '<div style="font-size: 32px; margin-bottom: 10px;">📸</div><div style="font-weight: 600; margin-bottom: 5px;">Paste or drop screenshot here</div><div class="paste-hint">Press Ctrl+V to paste an image</div>';
  pasteArea.style.borderColor = 'var(--border)';
  pasteArea.style.background = 'var(--surface-2)';
}

function openAddModal() {
  editingId = null; currentImage = null;
  document.getElementById('modalTitle').textContent = 'Add New Link'; document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('urlInput').value = ''; document.getElementById('titleInput').value = ''; document.getElementById('descInput').value = '';
  resetPasteArea(); populateCats(); openModal(); setTimeout(() => document.getElementById('urlInput').focus(), 100);
}
function openEditModal(id) {
  const link = links.find(l => l.id === id); if (!link) return; editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Link'; document.getElementById('deleteBtn').style.display = 'inline-flex';
  document.getElementById('urlInput').value = link.url; document.getElementById('titleInput').value = link.title; document.getElementById('descInput').value = link.description;
  if (link.preview) {
    currentImage = link.preview;
    pasteArea.innerHTML = '<img src="' + currentImage + '" style="max-width:100%;max-height:200px;border-radius:8px;" /><div style="margin-top:10px;font-weight:600;color:var(--success);">✓ Image loaded</div><div class="paste-hint">Click to change</div>';
    pasteArea.style.borderColor = 'var(--success)'; pasteArea.style.background = '#ecfdf5';
  } else { resetPasteArea(); }
  populateCats(); document.getElementById('categoryInput').value = link.category; openModal();
}

document.getElementById('addBtn').addEventListener('click', openAddModal);
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('cancelBtn').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

document.getElementById('urlInput').addEventListener('input', e => {
  clearTimeout(quickTimer); const url = e.target.value.trim(); if (!url) return;
  let valid = url.startsWith('http') ? url : 'https://' + url;
  try { new URL(valid); } catch { return; }
  quickTimer = setTimeout(() => {
    const d = autoDetect(valid);
    document.getElementById('titleInput').value = d.title; document.getElementById('categoryInput').value = d.category; document.getElementById('descInput').value = d.description;
  }, 400);
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  let url = document.getElementById('urlInput').value.trim(); if (!url) { showToast('Enter URL', 'error'); return; }
  if (!url.startsWith('http')) url = 'https://' + url; try { new URL(url); } catch { showToast('Invalid URL', 'error'); return; }
  const title = document.getElementById('titleInput').value.trim() || autoDetect(url).title;
  const category = document.getElementById('categoryInput').value;
  const description = document.getElementById('descInput').value.trim() || autoDetect(url).description;
  
  if (editingId) {
    const idx = links.findIndex(l => l.id === editingId);
    if (idx !== -1) { links[idx] = { ...links[idx], url, title, category, description, preview: currentImage || links[idx].preview }; await dbPut(links[idx]); links = await dbGetAll(); closeModal(); render(); triggerBackgroundSync(); }
  } else {
    if (links.some(l => l.url === url)) { showToast('Already saved', 'warning'); return; }
    const newLink = { id: 'l_' + Date.now(), url, title, category, description, favorite: false, date: new Date().toISOString(), preview: currentImage || getScreenshot(url) };
    await dbPut(newLink); links = await dbGetAll(); closeModal(); render(); triggerBackgroundSync();
  }
});
document.getElementById('deleteBtn').addEventListener('click', async () => { if (editingId && confirm('Delete?')) { await dbDelete(editingId); links = await dbGetAll(); closeModal(); render(); triggerBackgroundSync(); } });

// ============ QUICK ADD ============
const quickUrl = document.getElementById('quickUrl'); const quickBtn = document.getElementById('quickAddBtn');
quickUrl.addEventListener('input', () => {
  clearTimeout(quickTimer); const url = quickUrl.value.trim(); quickAddData = null;
  if (!url) { quickBtn.disabled = true; return; }
  let valid = url.startsWith('http') ? url : 'https://' + url;
  try { new URL(valid); } catch { quickBtn.disabled = true; return; }
  quickBtn.disabled = true; quickBtn.querySelector('span').textContent = 'Analyzing...';
  quickTimer = setTimeout(() => {
    const d = autoDetect(valid); quickAddData = { url: valid, title: d.title, category: d.category, description: d.description, preview: getScreenshot(valid) };
    quickBtn.disabled = false; quickBtn.querySelector('span').textContent = 'Save';
  }, 500);
});
quickBtn.addEventListener('click', async () => {
  if (!quickAddData) return; if (links.some(l => l.url === quickAddData.url)) { showToast('Already saved', 'warning'); return; }
  const newLink = { id: 'l_' + Date.now(), ...quickAddData, favorite: false, date: new Date().toISOString() };
  await dbPut(newLink); links = await dbGetAll(); render(); triggerBackgroundSync();
  quickUrl.value = ''; quickAddData = null; quickBtn.disabled = true; showToast('Saved!');
});
quickUrl.addEventListener('keydown', e => { if (e.key === 'Enter' && quickAddData) quickBtn.click(); });

// ============ SEARCH & EXPORT/IMPORT ============
document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderGrid(); });
document.getElementById('exportBtn').addEventListener('click', async () => {
  const all = await dbGetAll(); const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'links-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click(); URL.revokeObjectURL(url); showToast('Exported');
});
document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      const imported = JSON.parse(ev.target.result); if (!Array.isArray(imported)) throw new Error('Invalid');
      const existing = await dbGetAll(); const urls = new Set(existing.map(l => l.url)); let added = 0;
      for (const l of imported) { if (!urls.has(l.url)) { await dbPut({ id: l.id || 'l_' + Date.now(), url: l.url, title: l.title || autoDetect(l.url).title, description: l.description || '', category: l.category || 'other', favorite: l.favorite || false, date: l.date || new Date().toISOString(), preview: l.preview || getScreenshot(l.url) }); added++; } }
      links = await dbGetAll(); render(); triggerBackgroundSync(); showToast('Imported ' + added + ' links');
    } catch { showToast('Import failed', 'error'); }
  }; reader.readAsText(file); e.target.value = '';
});

function showToast(msg, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg; toast.style.background = type === 'error' ? 'var(--danger)' : 'var(--text)';
  toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============ INIT (Starts automatically) ============
(async () => {
  try { 
    links = await dbGetAll(); 
    render(); 
    // Trigger a silent sync in the background to backup any new local links
    triggerBackgroundSync(); 
  } catch (e) { console.error(e); render(); }
})();
</script>
</body>
</html>
